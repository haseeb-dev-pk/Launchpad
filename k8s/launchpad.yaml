apiVersion: v1
kind: Namespace
metadata:
  name: launchpad
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: launchpad-config
  namespace: launchpad
data:
  APP_VERSION: "1.0.0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: launchpad
  namespace: launchpad
  labels:
    app.kubernetes.io/name: launchpad
    app.kubernetes.io/part-of: delivery-platform
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: launchpad
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: launchpad
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: launchpad
          image: ghcr.io/YOUR_GITHUB_ORG/launchpad:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: launchpad-config
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: launchpad
  namespace: launchpad
spec:
  selector:
    app.kubernetes.io/name: launchpad
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: launchpad
  namespace: launchpad
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: launchpad.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: launchpad
                port:
                  name: http